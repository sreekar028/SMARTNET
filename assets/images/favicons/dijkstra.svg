<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Alternate longer paths (dimmed) -->
  <line x1="7.5" y1="21.5" x2="16" y2="24" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 1.5"/>
  <line x1="16" y1="24" x2="24.5" y2="21.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="2 1.5"/>
  <!-- Shortest Path Edges (Bold White) -->
  <line x1="7.5" y1="21.5" x2="16" y2="8.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="16" y1="8.5" x2="24.5" y2="21.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Graph Nodes -->
  <circle cx="16" cy="24" r="2.2" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="7.5" cy="21.5" r="3.2" fill="#ffffff"/>
  <circle cx="7.5" cy="21.5" r="1.3" fill="#15803d"/>
  <circle cx="24.5" cy="21.5" r="3.2" fill="#ffffff"/>
  <circle cx="24.5" cy="21.5" r="1.3" fill="#15803d"/>
  <circle cx="16" cy="8.5" r="3.6" fill="#86efac" stroke="#ffffff" stroke-width="1.2"/>
</svg>