<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <!-- Network links -->
  <line x1="16" y1="8" x2="8" y2="23" stroke="#dcfce7" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="24" y2="23" stroke="#dcfce7" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="23" x2="24" y2="23" stroke="#dcfce7" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="8" x2="16" y2="17" stroke="#dcfce7" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8" y1="23" x2="16" y2="17" stroke="#dcfce7" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="23" x2="16" y2="17" stroke="#dcfce7" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Central Hub Node -->
  <circle cx="16" cy="17" r="2.2" fill="#ffffff"/>
  <!-- Top Node -->
  <circle cx="16" cy="8" r="3.5" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <circle cx="16" cy="8" r="1.5" fill="#16a34a"/>
  <!-- Left Node -->
  <circle cx="8" cy="23" r="3.2" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <circle cx="8" cy="23" r="1.3" fill="#16a34a"/>
  <!-- Right Node -->
  <circle cx="24" cy="23" r="3.2" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <circle cx="24" cy="23" r="1.3" fill="#16a34a"/>
</svg>
